<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>English to Indian Languages Translator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Translate English into an Indian language</h1>

    <label for="text">English text</label>
    <textarea id="text" rows="5" placeholder="Type a phrase or a paragraph"></textarea>

    <label for="language">Translate to</label>
    <select id="language"></select>

    <label for="reference">Reference translation (optional, for BLEU score)</label>
    <textarea id="reference" rows="2" placeholder="Paste a correct translation to score the output"></textarea>

    <button id="translate-btn" type="button">Translate</button>
    <p id="error" role="alert" hidden></p>

    <section id="result" hidden>
      <h2>Translation</h2>
      <p id="output" lang=""></p>
      <p id="bleu" hidden></p>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
